<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YT Transcriber</title>
<style>
  :root {
    --bg: #0b0d13; --panel: #141824; --panel2: #1b2130; --line: #262d42;
    --text: #e9ecf4; --muted: #98a0b8; --accent: #ff4d5e; --accent2: #ff8a5c;
    --ok: #3ddc97; --warn: #ffc65c; --err: #ff5d6c;
    --mono: "Cascadia Code", "SF Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.55 -apple-system, "Segoe UI", Roboto, sans-serif;
         background-image:
           radial-gradient(900px 300px at 15% -10%, rgba(255,77,94,.08), transparent),
           radial-gradient(800px 260px at 85% -10%, rgba(255,138,92,.06), transparent); }
  a { color: var(--accent2); }

  header { padding: 20px 32px; border-bottom: 1px solid var(--line);
           display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
           position: sticky; top: 0; background: rgba(11,13,19,.85); backdrop-filter: blur(8px); z-index: 5; }
  .logo { font-size: 22px; font-weight: 800; letter-spacing: .2px; }
  .logo .t { background: linear-gradient(90deg, var(--accent), var(--accent2));
             -webkit-background-clip: text; background-clip: text; color: transparent; }
  .logo .yt { color: var(--text); }
  header .sub { color: var(--muted); font-size: 13px; }
  #pill { margin-left: auto; font-size: 12px; font-weight: 700; letter-spacing: .4px;
          text-transform: uppercase; padding: 6px 12px; border-radius: 999px;
          border: 1px solid var(--line); color: var(--muted); background: var(--panel); }
  #pill.running { color: var(--accent2); border-color: var(--accent2); }
  #pill.done    { color: var(--ok);    border-color: var(--ok); }
  #pill.error   { color: var(--err);   border-color: var(--err); }

  main { max-width: 980px; margin: 0 auto; padding: 26px 24px 90px; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px;
          box-shadow: 0 8px 30px rgba(0,0,0,.25); }
  #url { width: 100%; font-family: var(--mono); background: var(--panel2); color: var(--text);
         border: 1px solid var(--line); border-radius: 10px; padding: 12px; font-size: 14px; }
  #url:focus, input:focus, select:focus { outline: none; border-color: var(--accent); }
  .opts { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 14px; align-items: flex-end; }
  .fld { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 5px; }
  input[type=text], select {
    background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 9px 11px; font-size: 14px; }
  .checks { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 12px; }
  .checks label { flex-direction: row; align-items: center; gap: 7px; font-size: 13px; color: var(--text); cursor: pointer; }
  .checks input { accent-color: var(--accent); }
  button { background: linear-gradient(90deg, var(--accent), var(--accent2)); color: #fff; border: 0;
           border-radius: 10px; padding: 12px 26px; font-size: 15px; font-weight: 700; cursor: pointer;
           transition: filter .15s, transform .05s; }
  button:hover:not(:disabled) { filter: brightness(1.1); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.ghost { background: transparent; border: 1px solid var(--line); color: var(--text); }
  .actions { margin-top: 16px; display: flex; gap: 10px; align-items: center; }

  /* progress */
  #progress { margin-top: 16px; display: none; }
  #progress.visible { display: block; animation: fadein .25s ease; }
  .prog-top { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; }
  #stage { color: var(--text); font-weight: 600; }
  #pct { color: var(--accent2); font-weight: 800; font-family: var(--mono); }
  .bar { margin-top: 8px; height: 12px; background: var(--panel2); border: 1px solid var(--line);
         border-radius: 999px; overflow: hidden; }
  .bar-fill { height: 100%; width: 0%; border-radius: 999px;
              background: linear-gradient(90deg, var(--accent), var(--accent2));
              transition: width .45s ease; }
  .bar-fill.done { background: linear-gradient(90deg, var(--ok), #37b98a); }
  .bar-fill.error { background: var(--err); }
  .bar-fill.stripes { background-image:
        repeating-linear-gradient(45deg, rgba(255,255,255,.15) 0 8px, transparent 8px 16px);
        animation: slide 1s linear infinite; }
  @keyframes slide { to { background-position: 22px 0; } }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

  /* log */
  #logWrap { margin-top: 16px; display: none; }
  #logWrap.visible { display: block; animation: fadein .25s ease; }
  #log { font-family: var(--mono); font-size: 12.5px; padding: 12px 14px; height: 220px;
         overflow-y: auto; white-space: pre-wrap; color: var(--muted);
         background: #090b10; border: 1px solid var(--line); border-radius: 10px; cursor: text; }
  .log-time { color: #3b4358; margin-right: 8px; }
  .log-ok  { color: var(--ok); }
  .log-err { color: var(--err); }
  .log-warn { color: var(--warn); }
  .log-info { color: var(--text); }
  #logScroll { user-select: none; }

  .tabs { display: flex; gap: 4px; margin-top: 22px; border-bottom: 1px solid var(--line); }
  .tab { background: none; border: 0; color: var(--muted); padding: 10px 16px; font-size: 14px;
         cursor: pointer; border-bottom: 2px solid transparent; }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }

  #result { background: var(--panel); border: 1px solid var(--line); border-radius: 0 0 12px 12px; padding: 18px; min-height: 180px; }
  #result .meta { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
  #result h2 { font-size: 17px; margin: 6px 0 4px; }
  #result h3 { color: var(--accent2); font-size: 14px; margin: 18px 0 4px; }
  #result ul { margin: 6px 0 6px 20px; padding: 0; }
  #result p  { margin: 6px 0; }
  #result .line { font-family: var(--mono); font-size: 13px; padding: 3px 0; border-bottom: 1px solid #20243a; }
  #result pre { font-family: var(--mono); font-size: 12px; overflow-x: auto; }
  .warnbox { margin-top: 12px; padding: 10px 12px; border: 1px solid rgba(255,198,92,.4);
             background: rgba(255,198,92,.08); border-radius: 8px; color: var(--warn); font-size: 13px; }
  .vistim { margin-top: 12px; font-size: 13px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
  .vistim .v-row { font-family: var(--mono); font-size: 12px; padding: 2px 0; }
  .vistim .v-ts { color: var(--accent2); }

  .dl { margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap; }
  .dl a { color: var(--accent); text-decoration: none; font-size: 13px; border: 1px solid var(--line);
          border-radius: 6px; padding: 6px 10px; } .dl a:hover { background: var(--panel2); }

  #results h3 { color: var(--muted); margin-top: 30px; }
  #results ul { list-style: none; padding: 0; margin: 8px 0 0; }
  #results li { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
                padding: 10px 14px; margin-bottom: 8px; display: flex; justify-content: space-between;
                align-items: center; gap: 10px; flex-wrap: wrap; }
  #results li .t { font-weight: 600; } #results li .c { color: var(--muted); font-size: 13px; }
  .hidden { display: none; }
</style>
</head>
<body>
<header>
  <div class="logo"><span class="yt">YT</span> <span class="t">Transcriber</span></div>
  <div class="sub">Transcript + AI context report of what happened in the video</div>
  <span id="pill">Idle</span>
</header>

<main>
  <div class="card">
    <input id="url" placeholder="https://www.youtube.com/watch?v=..." autofocus>

    <div class="opts">
      <label class="fld">provider
        <select id="provider">
          <option value="auto">auto (cloud if key set)</option>
          <option value="cloud">cloud</option>
          <option value="local">local</option>
        </select>
      </label>
      <label class="fld">ollama model
        <input id="model" placeholder="default" style="min-width:170px">
      </label>
      <label class="fld">whisper model
        <select id="whisper_model">
          <option>base</option><option>tiny</option><option>small</option>
          <option>medium</option><option>large-v3</option>
        </select>
      </label>
      <label class="fld">language
        <input id="language" placeholder="auto" size="6">
      </label>
    </div>

    <div class="checks">
      <label><input type="checkbox" id="force_whisper"> force whisper</label>
      <label><input type="checkbox" id="no_vad"> no VAD</label>
      <label><input type="checkbox" id="vision" checked> visual context (video frames)</label>
      <label><input type="checkbox" id="voice" checked> voice analysis (pacing & energy)</label>
      <label><input type="checkbox" id="vision_doubt" checked> resolve visual doubts</label>
      <label><input type="checkbox" id="skip_context"> skip context</label>
    </div>

    <div class="opts">
      <label class="fld">vision mode
        <select id="vision_mode">
          <option value="per-frame">per-frame (full detail, default)</option>
          <option value="batch">batch (<=8 frames/request, faster)</option>
          <option value="mosaic">mosaic (grids, cheap overview)</option>
        </select>
      </label>
      <label class="fld">frame interval (s)
        <input id="frame_interval" type="number" min="0.1" step="0.1" value="1" size="5" title="Seconds between frames; 1 = one frame per second of video">
      </label>
      <label class="fld">max frames
        <input id="max_frames" type="number" min="1" step="1" value="600" size="5" title="Largest number of frames to analyze; longer videos are down-sampled evenly">
      </label>
      <label class="fld">dedupe max gap (s)
        <input id="dedupe_max_gap" type="number" min="1" step="1" value="10" size="5" title="Never skip more than this many seconds between kept frames, even if unchanged">
      </label>
      <label class="fld">window (s)
        <input id="vision_window" type="number" min="1" step="1" value="30" size="5" title="Group frame descriptions into this many seconds per summary window">
      </label>
      <label class="fld">batch size
        <input id="batch_size" type="number" min="1" max="8" step="1" value="8" size="4" title="Images per request in batch mode (8 max keeps timestamps reliable)">
      </label>
      <label class="fld">mosaic cells
        <input id="mosaic_cells" placeholder="auto" size="5" title="Cells per grid in mosaic mode; empty = auto (max 144)">
      </label>
      <label class="fld">target calls
        <input id="target_grids" type="number" min="1" step="1" value="24" size="4" title="Target number of vision calls; drives auto grid sizing">
      </label>
      <label class="fld">doubt fill budget
        <input id="vision_fill_budget" type="number" min="1" step="1" value="60" size="4" title="Maximum frames the second vision pass may capture at doubtful timestamps">
      </label>
    </div>

    <div class="actions">
      <button id="run" onclick="start()">Transcribe</button>
      <button class="ghost" onclick="loadResults()">Refresh results</button>
    </div>

    <div id="progress">
      <div class="prog-top">
        <span id="stage">Starting... </span>
        <span id="pct">0%</span>
      </div>
      <div class="bar"><div class="bar-fill stripes" id="barFill"></div></div>
    </div>

    <div id="logWrap">
      <div id="log"><span id="logScroll">Ready. Paste a YouTube URL and hit Transcribe.</span></div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" id="tabTranscript" onclick="showTab('transcript')">Transcript</button>
    <button class="tab" id="tabContext" onclick="showTab('context')">Context</button>
    <button class="tab" id="tabJson" onclick="showTab('json')">JSON</button>
  </div>
  <div id="result">
    <div class="meta hidden" id="meta"></div>
    <div id="pane-transcript"></div>
    <div id="pane-context" class="hidden"></div>
    <div id="pane-json" class="hidden"></div>
    <div class="dl hidden" id="dl"></div>
  </div>

  <div id="results">
    <h3>Previous results</h3>
    <ul id="resultsList"></ul>
  </div>
</main>

<script>
let jobTimer = null;
let sawLog = false;

const $id = id => document.getElementById(id);

function options() {
  const val = id => $id(id).value.trim();
  const chk = id => $id(id).checked;
  return {
    provider: $id("provider").value,
    model: val("model") || null,
    whisper_model: val("whisper_model"),
    language: val("language") || null,
    device: "cpu",
    force_whisper: chk("force_whisper"),
    no_vad: chk("no_vad"),
    skip_context: chk("skip_context"),
    vision: chk("vision"),
    vision_model: null,
    vision_mode: $id("vision_mode").value,
    frame_interval: parseFloat($id("frame_interval").value) || 1,
    max_frames: parseInt($id("max_frames").value, 10) || 600,
    vision_window: parseFloat($id("vision_window").value) || 30,
    dedupe: true,
    dedupe_max_gap: parseFloat($id("dedupe_max_gap").value) || 10,
    batch_size: parseInt($id("batch_size").value, 10) || 8,
    mosaic_cells: (function(){ var v = $id("mosaic_cells").value.trim(); return v ? (parseInt(v,10)||null) : null; })(),
    target_grids: parseInt($id("target_grids").value, 10) || 24,
    voice: chk("voice"),
    voice_window: 30,
    vision_doubt: chk("vision_doubt"),
    vision_fill_budget: parseInt($id("vision_fill_budget").value, 10) || 60
  };
}

function ts() {
  const d = new Date();
  return String(d.getHours()).padStart(2, "0") + ":" +
         String(d.getMinutes()).padStart(2, "0") + ":" +
         String(d.getSeconds()).padStart(2, "0");
}

function logLine(msg) {
  const el = $id("log");
  const box = $id("logWrap");
  box.classList.add("visible");
  if (!sawLog) {
    $id("logScroll").remove();
    sawLog = true;
  }
  const line = document.createElement("div");
  const time = document.createElement("span");
  time.className = "log-time";
  time.textContent = ts();
  line.appendChild(time);
  const text = document.createElement("span");
  text.textContent = msg;
  const cls = /(Error|failed)/i.test(msg) ? "log-err"
             : /(skipped|unavailable|unable)/i.test(msg) ? "log-warn"
             : /(Done|Wrote|Got|Source:|Captions)/i.test(msg) ? "log-ok"
             : "log-info";
  text.className = cls;
  line.appendChild(text);
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

function setProgress(pct, stage, cls) {
  $id("progress").classList.add("visible");
  $id("barFill").style.width = Math.min(100, Math.max(0, pct)) + "%";
  $id("stage").textContent = stage;
  $id("pct").textContent = pct + "%";
  if (cls) { $id("barFill").className = "bar-fill " + cls; }
}

function pill(text, cls) {
  const p = $id("pill");
  p.textContent = text;
  p.className = cls ? cls : "";
}

function start() {
  const url = $id("url").value.trim();
  if (!url) { alert("Paste a YouTube URL first."); return; }
  sawLog = false;
  $id("log").innerHTML = '<span id="logScroll"></span>';
  $id("run").disabled = true;
  $id("barFill").className = "bar-fill stripes";
  pill("Working", "running");
  setProgress(0, "Queued... ", "");
  logLine("Submitting job...");
  fetch("/v1/jobs", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ url: url, options: options() })
  }).then(r => r.json()).then(job => poll(job.job_id))
    .catch(e => {
      tooltipErr("Error: " + e);
    });
}

function tooltipErr(msg) {
  pill("Error", "error");
  logLine(msg);
  setProgress(100, "Error", "error");
  $id("run").disabled = false;
}

function poll(id) {
  if (jobTimer) clearInterval(jobTimer);
  jobTimer = setInterval(() => {
    fetch("/v1/jobs/" + id).then(r => r.json()).then(job => {
      setProgress(job.progress, job.status === "running" ? job.stage : job.stage, "");
      if (job.status === "pending") return;
      if (job.status === "running" && job.log.length) {
        const joined = job.log.join("\n");
        syncLog(joined);
      }
      if (job.status === "done") {
        clearInterval(jobTimer);
        pill("Done", "done");
        setProgress(100, "Done", "done");
        syncLog(job.log.join("\n"));
        logLine("Done.");
        render(job.result);
        loadResults();
        $id("run").disabled = false;
      } else if (job.status === "error") {
        clearInterval(jobTimer);
        tooltipErr("Error: " + (job.error || "unknown"));
        $id("run").disabled = false;
      }
    }).catch(e => tooltipErr("Polling error: " + e));
  }, 700);
}

function syncLog(raw) {
  const lines = raw.split("\n");
  $id("log").innerHTML = "";
  lines.forEach(l => {
    const div = document.createElement("div");
    const text = document.createElement("span");
    text.textContent = l;
    const cls = /(Error|failed)/i.test(l) ? "log-err"
                : /(skipped|unavailable|unable)/i.test(l) ? "log-warn"
                : /(Done|Wrote|Got|Source:|Captions)/i.test(l) ? "log-ok"
                : "log-info";
    text.className = cls;
    div.appendChild(text);
    $id("log").appendChild(div);
  });
  $id("logWrap").classList.add("visible");
  $id("log").scrollTop = $id("log").scrollHeight;
}

function fmt(s) {
  const sec = Math.max(0, Math.floor(s));
  return String(Math.floor(sec / 60)).padStart(2, "0") + ":" + String(sec % 60).padStart(2, "0");
}

function render(res) {
  const meta = $id("meta");
  meta.classList.remove("hidden");
  meta.textContent = res.meta.title + " \u2014 " + res.meta.channel +
    "   \u00b7   source: " + res.source + "   \u00b7   " + res.segments.length + " segments";

  let warns = "";
  if (res.warnings && res.warnings.length) {
    warns = '<div class="warnbox">' + res.warnings.map(w => "! " + esc(w)).join("<br>") + "</div>";
  }

  let vis = "";
  if (res.visual_timeline && res.visual_timeline.length) {
    const nFrames = (res.visual_frames && res.visual_frames.length) || 0;
    vis = '<div class="vistim">Visual observations (' +
      nFrames + " frames packed into " + res.visual_timeline.length + " window summaries):" +
      res.visual_timeline.map(v =>
        '<div class="v-row"><span class="v-ts">' + fmt(v.ts) + "</span> \u2014 " + esc(v.description) + "</div>")
      .join("") + "</div>";
  }

  $id("pane-transcript").innerHTML =
    res.segments.map(s => '<div class="line">[<b>' + fmt(s.start) + "</b>] " + esc(s.text) + "</div>").join("") + warns;

  $id("pane-context").innerHTML =
    markdown(res.context_report || "_(no context report \u2014 it was skipped or failed)_") + vis + warns;

  $id("pane-json").innerHTML =
    "<pre>" + esc(JSON.stringify(res, null, 2)) + "</pre>";

  const dl = $id("dl");
  dl.classList.remove("hidden");
  dl.innerHTML = (res.files || []).map(f =>
    '<a href="' + f.url + '">download ' + f.name + "</a>").join("");

  showTab("context");
}

function renderResults(list) {
  const ul = $id("resultsList");
  ul.innerHTML = "";
  if (!list.length) { ul.innerHTML = "<li><span class=c>No results yet.</span></li>"; return; }
  list.forEach(r => {
    const li = document.createElement("li");
    const t = document.createElement("span");
    t.className = "t";
    t.textContent = r.title || r.video_id;
    const c = document.createElement("span");
    c.className = "c";
    c.textContent = (r.channel || "") + " \u00b7 " + r.video_id;
    li.appendChild(t);
    li.appendChild(c);
    ul.appendChild(li);
  });
}

function markdown(md) {
  let html = "", list = [];
  for (const raw of md.split(/\r?\n/)) {
    const line = raw.trimEnd();
    const escLine = esc(line);
    if (/^# /.test(line)) html += "<h2>" + esc(line.slice(2)) + "</h2>";
    else if (/^## /.test(line)) html += "<h3>" + esc(line.slice(3)) + "</h3>";
    else if (/^- /.test(line)) list.push("<li>" + esc(line.slice(2)) + "</li>");
    else {
      if (list.length) { html += "<ul>" + list.join("") + "</ul>"; list = []; }
      if (line) html += "<p>" + bold(escLine) + "</p>";
    }
  }
  if (list.length) html += "<ul>" + list.join("") + "</ul>";
  return html;
}
function bold(s) { return s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>"); }
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

function showTab(name) {
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  $id("tab" + name[0].toUpperCase() + name.slice(1)).classList.add("active");
  ["transcript", "context", "json"].forEach(p =>
    $id("pane-" + p).classList.toggle("hidden", p !== name));
}

function loadResults() {
  fetch("/v1/results").then(r => r.json()).then(renderResults).catch(() => {});
}

$id("url").addEventListener("keydown", e => { if (e.key === "Enter") start(); });
loadResults();
</script>
</body>
</html>
